[project]
authors = [{name = "sargol", email = "sargol.mazraedoost@gmail.com"}]
dependencies = ["pingouin>=0.6.1,<0.7", "scikit-posthocs>=0.14.0,<0.15", "scienceplots>=2.2.2,<3"]
name = "tox-ames"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
pandas = "<3"
datasets = ">=4.5.0,<5"
mlxtend = ">=0.24.0,<0.25"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.8.0,<2"
imbalanced-learn = ">=0.14.1,<0.15"
splito = ">=0.1.4,<0.2"
datamol = ">=0.12.5,<0.13"
optuna = ">=4.7.0,<5"
transformers = ">=5.2.0,<6"
numpy = "<2"
rdkit = "<=2025.9.3"
xlrd = ">=2.0.2,<3"
umap-learn = ">=0.5.11,<0.6"
statsmodels = ">=0.14.6,<0.15"
setuptools = "<82"
papermill = ">=2.7.0,<3"

[tool.pixi.pypi-dependencies]
tox_ames = { path = ".", editable = true }
torch = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torch-geometric = ">=2.7.0, <3"
lightning = ">=2.6.1, <3"
torchmetrics = ">=1.8.2, <2"
peft = ">=0.18.1, <0.19"
deepchem = ">=2.8.0, <3"
pytdc = ">=0.3.6, <0.4"
chemprop = ">=2.2.2, <3"
optuna-integration = { version = ">=4.7.0, <5", extras = ["pytorch-lightning"] }
scikit-fingerprints = { git = "https://github.com/scikit-fingerprints/scikit-fingerprints.git", branch = "master" }
padelpy = ">=0.1.16, <0.2"
tyro = ">=1.0.13, <2"
pydantic-yaml = ">=1.6.0, <2"
marimo = ">=0.23.13, <0.24"
aim = ">=3.29.1, <4"

[tool.pixi.tasks]
